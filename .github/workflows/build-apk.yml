name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "kamyab-v5-apk"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JARVIS-Kamyab-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Kamyab-debug
          path: JARVIS-Kamyab-debug.apk
          if-no-files-found: error
